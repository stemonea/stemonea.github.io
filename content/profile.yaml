bio:
  - "I am a Ph.D. student at DIMES, University of Calabria. I am particularly interested in integrating LLMs with formal argumentation frameworks. My goal is to develop systems capable of identifying, structuring, and reasoning about human arguments. I am also exploring model interpretability and explainability, with a focus on understanding, analyzing, and explaining the internal mechanisms and decisions of AI models."
  - "I earned an M.Sc. in Computer Engineering, specializing in Artificial Intelligence and Machine Learning, from the University of Calabria, graduating with a final grade of 110/110 cum laude. My Master's thesis focused on extracting knowledge-augmented quantitative bipolar argumentation frameworks using Large Language Models, under the supervision of Prof. Sergio Greco and Dr. Lucio La Cava."
  - "In 2026, I worked as a research fellow at DIMES, focusing on the automatic extraction of argumentative structures from political debates using Transformer-based models."
